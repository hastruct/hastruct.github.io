name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
  schedule:
    # Chạy mỗi thứ Sáu lúc 11:00 UTC = 18:00 giờ Việt Nam (UTC+7)
    # Đảm bảo các bài đặt lịch future (future: false) tự động lên sóng đúng giờ
    - cron: '0 11 * * 5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 1 # Increment this to reset cache if needed

      - name: Inject dispatch token
        env:
          DISPATCH_TOKEN: ${{ secrets.ACTIONS_DISPATCH_TOKEN }}
        run: |
          if [ -n "$DISPATCH_TOKEN" ]; then
            sed -i "s|__DISPATCH_TOKEN__|${DISPATCH_TOKEN}|g" \
              apps/social-media-downloader/assets/js/app.js
          fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        # Outputs to ./_site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
