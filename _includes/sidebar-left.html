<!-- ============================================================
     GA4 STATUS CHECKER - SIMPLE VERSION
     
     Function:
     - Check if GA4 gtag is loaded
     - Update badge status
     - Send tracking event
     
     No external APIs, no dependencies, no fallback needed
============================================================ -->
<script>
(function() {
  var badgeEl = document.getElementById('hst-ga4-badge');

  function checkGA4Status() {
    if (typeof gtag === 'function') {
      // GA4 is available and working
      badgeEl.innerText = '✓ Active';
      badgeEl.style.background = '#d4edda';
      badgeEl.style.color = '#155724';
      
      console.log('✅ GA4 tracking is ACTIVE');
      
      // Send custom event to GA4
      gtag('event', 'sidebar_view', {
        'event_category': 'engagement',
        'event_label': 'analytics_section',
        'page_location': window.location.href
      });
    } else {
      // GA4 not found
      badgeEl.innerText = '✗ Offline';
      badgeEl.style.background = '#f8d7da';
      badgeEl.style.color = '#721c24';
      
      console.warn('⚠️ GA4 tracking NOT available');
    }
  }

  // Check when page loads
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(checkGA4Status, 500);
    });
  } else {
    checkGA4Status();
  }
})();
</script>
