<article class="post-card highlight-card">
  {% if post.header.teaser %}
  <a href="{{ post.url | relative_url }}" class="post-card__thumb-link">
    <div class="post-card__thumb" style="background-image: url('{{ post.header.teaser | relative_url }}');">
      <span class="badge-featured"><i class="fas fa-star"></i> Nổi bật</span>
    </div>
  </a>
  {% endif %}
  
  <div class="post-card__body">
    <div class="post-card__meta">
      <time class="post-card__date">{{ post.date | date: "%d/%m/%Y" }}</time>
      {% if post.categories.first %}
      <span class="post-card__cat">{{ post.categories.first }}</span>
      {% endif %}
    </div>
    
    <h3 class="post-card__title">
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </h3>
    
    <p class="post-card__excerpt">
      {{ post.excerpt | markdownify | strip_html | truncatewords: 25 }}
    </p>

    <a href="{{ post.url | relative_url }}" class="post-card__readmore">Xem chi tiết →</a>
  </div>
</article>

<style>
  .highlight-card {
    border: 1px solid #e1e8ed;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    background: #fff;
  }
  .highlight-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  }
  .badge-featured {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #f39c12;
    color: white;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: bold;
    text-transform: uppercase;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }
</style>
